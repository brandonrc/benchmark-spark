# versions.lock — expected software stack for v2 reproducibility runs
#
# capture_environment.sh --verify configs/versions.lock will fail if any of
# these substrings is NOT present in the captured fields. This prevents a
# run from starting against an unpinned / drifted stack.
#
# Update this file deliberately when re-running; do NOT update it to match
# a drifted host.

# Kernel (substring match against `uname -srmpio`)
kernel_contains = "6.11.0-1016-nvidia"

# Cgroup version — v2 required for memory.current / memory.peak reads.
cgroup_version = "v2"

# NVIDIA driver (substring match against nvidia-smi --query-gpu output)
nvidia_driver_contains = "580.95.05"

# Docker (substring match against `docker --version`)
docker_version_contains = "Docker version 27."

# NVIDIA Container Toolkit (substring match against nvidia-container-cli --version)
nct_version_contains = "cli-version:"

# Container image name (exact match against ${CONTAINER_IMAGE})
container_image = "nvcr.io/nvidia/tensorrt-llm/release:spark-single-gpu-dev"

# Container image digest — update this after your first `docker pull` and
# capture the output of:
#   docker image inspect --format '{{index .RepoDigests 0}}' $CONTAINER_IMAGE
#
# Leave blank to skip digest verification (not recommended — but unavoidable
# before the first pull).
container_image_digest = ""
